
name: Build Wurst Client

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Apply Spotless formatting
        run: ./gradlew spotlessApply --no-daemon

      - name: Verify formatting
        run: ./gradlew spotlessJavaCheck --no-daemon

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Show generated JAR files
        run: find . -type f -path '*/build/libs/*.jar' -print

      - name: Upload JAR files
        uses: actions/upload-artifact@v4
        with:
          name: WurstClient-build
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 7

